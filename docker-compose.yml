version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MOCK_MODE=true
  
  frontend:
    image: streamlit/streamlit:latest
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    command: streamlit run app.py